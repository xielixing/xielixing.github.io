baseURL = "https://xielixing.github.io/"
defaultContentLanguage = "zh"
title = "Xie Lixing's Blog"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = "production"
  author = "Xie Lixing"
  description = "Learning notes by Xie Lixing"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocSide = "right"
  disableSpecial1stPost = true
  hideMeta = false
  disableThemeToggle = true

  [params.label]
    text = "Lixing's Blog"

  [params.homeInfoParams]
    Title = "👋 Welcome to Xie Lixing's Blog"
    Content = "Hi, this is Xie Lixing. I document my learning notes here since 2026."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/xielixing"

  [params.assets]
    disableFingerprinting = false

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  lineNos = true
  codeFences = true
  guessSyntax = true
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.parser.attribute]
  title = true
